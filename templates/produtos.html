<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
</head>
<body>
    <h1>Estoque</h1>
<table>
    <tr>
        <th> Nome </th>
        <th> Quantidade </th>
        <th> Preço </th>
    </tr>
    {% for item in produtos %}
        <tr>
            <td>{{item[1]}}</td>
            <td>{{item[2]}}</td>
            <td>{{item[3]}}</td>
        </tr>
    {% endfor %}
</table>

</body>
</html>
