<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
    <h2> ☰ Menu</h2>
        <br>
    <a href="/cadastro">Cadastrar</a>
        <a href="/produtos">Produtos</a>
    </nav>
    <h1>    Estoque</h1>
<table>
    <tr>
        <th> Nome </th>
        <th> Quantidade </th>
        <th> Preço </th>
        <th> Ação </th>
    </tr>
    {% for item in produtos %}
    <tr>
        <td>{{item[1]}}</td>
        <td>{{item[2]}}</td>
        <td>{{item[3]}}</td>
        <td>
            <form method="POST" action="/excluir">
                <input type="hidden" name="nome" value="{{item[1]}}">
                <button type="submit">Excluir</button>
            </form>
            <a href="{{ url_for('alterar', nome=item[1]) }}">Alterar</a>
        </td>
    </tr>
{% endfor %}
</table>


</body>
</html>
